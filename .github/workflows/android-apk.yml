name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  NDK_VERSION: 30.0.16248370
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y wget cmake make libtool m4 automake pkg-config unzip

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_PATH=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Download native sources
        run: cd android/libbaresip-android && make download-sources

      - name: Patch zrtpcpp for CMake 4
        run: |
          cd android/libbaresip-android
          files=$(grep -rl cmake_minimum_required zrtpcpp --include=CMakeLists.txt)
          for f in $files; do sed -i -E 's/cmake_minimum_required\s*\(\s*VERSION [0-9.]+\)/cmake_minimum_required(VERSION 3.5)/' "$f"; done
          grep -n cmake_minimum_required zrtpcpp/CMakeLists.txt | head -3

      - name: Build native libs (3 ABIs)
        run: |
          cd android/libbaresip-android
          for arch in arm64-v8a armeabi-v7a x86_64; do
            make libbaresip ANDROID_TARGET_ARCH=$arch NDK_PATH=$NDK_PATH OUTPUT_DIR=$GITHUB_WORKSPACE/android/baresip-studio/distribution
          done
          find ../baresip-studio/distribution -name '*.a' | wc -l

      - name: Setup Gradle (wrapper jar not committed upstream)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build APKs (debug + release)
        run: |
          cd android/baresip-studio
          gradle assembleDebug assembleRelease --no-daemon

      - name: Verify APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          find android/baresip-studio/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            echo "=== $apk"
            "$BT/aapt" dump badging "$apk" | grep -E '^package|^sdkVersion|^native-code'
          done
          find android/baresip-studio/app/build/outputs/apk -name '*debug*.apk' | while read -r apk; do
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ymax-android-apks
          path: android/baresip-studio/app/build/outputs/apk/**/*.apk

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ymax-android-apks
          path: apks

      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            APK=$(find apks -name '*debug*.apk' | head -1)
            echo "installing: $APK"
            adb install -r "$APK"
            adb shell monkey -p com.tutpro.baresip -c android.intent.category.LAUNCHER 1
            sleep 25
            if adb shell pidof com.tutpro.baresip; then echo "APP PROCESS ALIVE"; else echo "APP PROCESS DEAD"; fi
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*Error" | head -10 || echo "no fatal exceptions"
