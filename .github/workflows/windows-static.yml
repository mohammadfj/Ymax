name: Windows static build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-compiled OpenSSL (baresip/tools)
        shell: bash
        run: |
          curl -fsSL -o openssl.zip "https://github.com/baresip/tools/releases/download/v2026.10.0/openssl-windows-x64.zip"
          7z x openssl.zip
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE\\openssl-windows-x64" >> "$GITHUB_ENV"

      - name: Clone libre (main)
        shell: bash
        run: git clone --depth 1 https://github.com/baresip/re.git

      - name: Build libre
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S re -B re\build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_SHARED_LINKER_FLAGS="crypt32.lib"
          cmake --build re\build -j

      - name: Export absolute re_DIR + verify config file
        shell: bash
        run: |
          ls re/cmake/
          echo "RE_DIR_ABS=$GITHUB_WORKSPACE/re/cmake" >> "$GITHUB_ENV"

      - name: Build baresip (static)
        shell: cmd
        working-directory: core/baresip
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B ..\build-static -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DSTATIC=1 -DOPENSSL_USE_STATIC_LIBS=TRUE -DCMAKE_EXE_LINKER_FLAGS="crypt32.lib" -DRE_LIBRARY="..\re\build\re.lib" -DRE_INCLUDE_DIR="..\re\include" -Dre_DIR="%RE_DIR_ABS%" -DMODULES="g711;l16;auconv;auresamp;aufile;mixausrc;ice;srtp;dtls_srtp"
          cmake --build ..\build-static -j

      - name: Smoke test + Package
        shell: bash
        run: |
          mkdir -p stage/bin
          find core/build-static -name "baresip.exe" -not -path "*CMakeFiles*" -exec cp {} stage/bin/ \;
          cp core/baresip/LICENSE stage/ 2>/dev/null || true
          ./stage/bin/baresip.exe -v || echo "(smoke test failed - investigate)"
          7z a ymax-desktop-windows.zip stage

      - uses: actions/upload-artifact@v4
        with:
          name: ymax-desktop-windows
          path: ymax-desktop-windows.zip
